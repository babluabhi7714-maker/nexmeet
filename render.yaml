services:
  - type: web
    name: gather-video-meeting
    runtime: node
    plan: free
    repo: https://github.com/babluabhi7714-maker/nexmeet.git
    branch: workspace-project
    autoDeployTrigger: commit
    rootDir: .
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: TURN_URL
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
